name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Syntax-check all modules
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check runtime/electron-helper/main.js
          node --check runtime/electron-helper/preload.js
          node --check runtime/electron-helper/renderer.js
      - name: Unit tests
        run: npm test
      - name: No UTF-8 BOM in package files
        run: node scripts/check-bom.mjs
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
