name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check all modules
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check runtime/electron-helper/main.js
          node --check runtime/electron-helper/preload.js
          node --check runtime/electron-helper/renderer.js
      - name: Host module imports and exports the Cordis plugin contract
        run: node -e "const m = await import('./lib/index.js'); if (typeof m.apply !== 'function' || !Array.isArray(m.inject) || typeof m.name !== 'string') throw new Error('bad host export'); console.log('host ok:', m.name)"
      - name: Published tarball shape
        run: npm pack --dry-run 2>&1 | grep -E 'assets/capybara.png|cordis.patch.yml' || (echo 'expected files missing' && exit 1)
      - name: Required manifest fields
        run: node -e "const p = require('./package.json'); if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) throw new Error('missing dsh.bundle manifest'); if (!p.exports || !p.exports['./client']) throw new Error('missing ./client export'); console.log('manifest ok')"
