<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>CapyReporter · DSH Pet</title>
  <style>
    html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font-family:system-ui,'Segoe UI',sans-serif;color-scheme:dark}
    #root{position:relative;width:100%;height:100%;pointer-events:none}
    #bubble{position:absolute;bottom:143px;left:50%;transform:translateX(-50%);width:360px;max-width:calc(100% - 24px);max-height:240px;overflow:auto;box-sizing:border-box;background:#fdfdf7;color:#22242c;border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 4px 14px #0007;display:none;z-index:5;pointer-events:auto;overflow-wrap:anywhere}
    .bub-head{font-weight:600;display:block}.bub-detail{display:block;opacity:.85}
    .bub-log{display:none;max-height:150px;overflow:auto;white-space:pre-wrap;font-size:12px;margin:6px 0}
    .bub-log.is-on{display:block}
    .actions{display:flex;gap:6px;margin-top:8px}
    button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:1px solid #8888;border-radius:6px;padding:4px 7px}
    :focus-visible{outline:3px solid #4f8cff;outline-offset:2px}
    #img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:132px;height:auto;object-fit:contain;pointer-events:auto;cursor:grab;touch-action:none;filter:drop-shadow(0 6px 16px #0008)}
    #menu{position:absolute;bottom:6px;right:6px;display:none;flex-direction:column;gap:6px;background:#23262f;color:#e8eaf0;border:1px solid #8888;border-radius:10px;padding:8px;box-shadow:0 8px 24px #0009;z-index:9;pointer-events:auto}
    #menu button{text-align:left}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="root">
    <section id="bubble" aria-label="CapyReporter activity">
      <span id="bubbleHead" class="bub-head" role="status" aria-live="polite"></span>
      <span id="bubbleDetail" class="bub-detail"></span>
      <div id="bubbleLog" class="bub-log" tabindex="0" aria-label="Session activity details"></div>
      <div class="actions">
        <button id="detailsButton" aria-expanded="false">Details</button>
        <button id="dismissButton">Dismiss</button>
        <button id="muteButton">Mute 30 min</button>
      </div>
    </section>
    <img id="img" draggable="false" alt="CapyReporter controls; drag to move" role="button" tabindex="0" aria-expanded="false" />
    <div id="menu" role="group" aria-label="CapyReporter controls">
      <button id="menuRestore">Restore bubble</button>
      <button id="menuSite">Open DeepSeek Harness</button>
      <button id="menuHide">Use page pet instead</button>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
